<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — tenge.gg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060709;--glass:rgba(255,255,255,.03);--glass-border:rgba(255,255,255,.1);--cyan:#00F2FE;--blue:#4FACFE;--violet:#8B5CF6;--text:#E7EAF0;--muted:#8A93A6;--green:#34d399;--gold:#e8c46a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.03em}
::selection{background:rgba(0,242,254,.3)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1a2230;border-radius:8px}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-fx::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,242,254,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,254,.03) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.orb-1{width:500px;height:500px;top:-180px;left:30%;background:rgba(0,242,254,.08)}
.grad-text{background:linear-gradient(135deg,#00F2FE 0%,#4FACFE 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.glass{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px}

header{position:sticky;top:0;z-index:100;background:rgba(6,7,9,.75);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav{display:flex;align-items:center;gap:14px;max-width:1280px;margin:0 auto;padding:13px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo-mark{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 19px 'Space Grotesk';color:#060709;background:linear-gradient(135deg,#00F2FE,#4FACFE);box-shadow:0 0 22px rgba(0,242,254,.45)}
.logo-name{font:700 20px 'Space Grotesk'}
.logo-name span{color:var(--cyan)}
.nav-links{display:flex;gap:24px;margin-left:26px}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--cyan)}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:32px 20px 90px}

/* profile head */
.p-head{padding:26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.p-ava{position:relative;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#00F2FE,#8B5CF6);display:flex;align-items:center;justify-content:center;font:700 30px 'Space Grotesk';color:#060709;flex-shrink:0;box-shadow:0 0 30px rgba(0,242,254,.3)}
.p-ava::after{content:'';position:absolute;bottom:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid var(--bg);box-shadow:0 0 10px rgba(52,211,153,.8)}
.p-info h1{font-size:24px;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.founder{font:700 10px 'Space Grotesk';letter-spacing:.08em;padding:4px 12px;border-radius:100px;background:rgba(184,134,11,.15);color:var(--gold);border:1px solid rgba(184,134,11,.4)}
.p-meta{font-size:12px;color:var(--muted);margin-top:5px}
.p-meta b{color:#f5c542}
.p-balance{margin-left:auto;text-align:right}
.p-balance .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.p-balance .sum{font:700 30px 'Space Grotesk';letter-spacing:-0.02em}
.btn-kaspi{margin-top:8px;padding:11px 22px;border-radius:12px;border:none;cursor:pointer;font:700 13px 'Space Grotesk';color:#060709;background:linear-gradient(135deg,#00F2FE,#4FACFE);box-shadow:0 0 18px rgba(0,242,254,.4);transition:.25s}
.btn-kaspi:hover{transform:translateY(-2px);box-shadow:0 0 32px rgba(0,242,254,.65)}

/* tabs */
.tabs{display:flex;gap:8px;margin:26px 0 20px;flex-wrap:wrap}
.tab{padding:11px 22px;border-radius:100px;cursor:pointer;font:600 13px 'Space Grotesk';color:var(--muted);background:var(--glass);border:1px solid var(--glass-border);transition:.25s}
.tab:hover{color:#fff;border-color:rgba(0,242,254,.4)}
.tab.active{color:#060709;background:linear-gradient(135deg,#00F2FE,#4FACFE);border-color:transparent;box-shadow:0 0 18px rgba(0,242,254,.4)}
.tab .cnt{margin-left:6px;font-size:11px;opacity:.75}

/* order cards */
.order{padding:20px;margin-bottom:14px}
.o-head{display:flex;align-items:flex-start;gap:13px;flex-wrap:wrap}
.o-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,242,254,.08);border:1px solid rgba(255,255,255,.1)}
.o-title{font:600 15px 'Space Grotesk';color:#fff}
.o-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.o-price{margin-left:auto;text-align:right}
.o-price .p{font:700 18px 'Space Grotesk'}
.o-price .st-tag{display:inline-block;margin-top:4px;font:700 10px 'Space Grotesk';letter-spacing:.06em;padding:3px 10px;border-radius:100px}
.st-hold{background:rgba(0,242,254,.1);color:var(--cyan);border:1px solid rgba(0,242,254,.3)}
.st-done{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.st-dispute{background:rgba(255,90,90,.1);color:#ff9090;border:1px solid rgba(255,90,90,.3)}
.st-wait{background:rgba(245,197,66,.1);color:#f5c542;border:1px solid rgba(245,197,66,.3)}

/* stepper */
.stepper{display:flex;align-items:center;margin:18px 0 6px;overflow-x:auto;padding-bottom:4px}
.stp{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:86px;flex-shrink:0}
.stp .dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);transition:.3s}
.stp .lb{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;max-width:90px}
.stp.done .dot{border-color:var(--green);background:var(--green);color:#060709;box-shadow:0 0 12px rgba(52,211,153,.5)}
.stp.done .lb{color:var(--green)}
.stp.now .dot{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(0,242,254,.5);animation:pulse 1.6s infinite}
.stp.now .lb{color:var(--cyan);font-weight:600}
@keyframes pulse{50%{box-shadow:0 0 24px rgba(0,242,254,.8)}}
.stp-line{flex:1;height:2px;min-width:20px;background:rgba(255,255,255,.1);margin:0 4px 22px}
.stp-line.done{background:var(--green)}

.o-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-dispute{padding:10px 20px;border-radius:11px;cursor:pointer;font:700 12px 'Space Grotesk';color:#ff9090;background:rgba(255,90,90,.07);border:1px solid rgba(255,90,90,.3);transition:.25s}
.btn-dispute:hover{background:rgba(255,90,90,.14);box-shadow:0 0 16px rgba(255,90,90,.2)}
.btn-ok{padding:10px 20px;border-radius:11px;cursor:pointer;font:700 12px 'Space Grotesk';color:var(--green);background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.3);transition:.25s}
.btn-ok:hover{background:rgba(52,211,153,.14)}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:12px}

/* dispute modal */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(3,4,6,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:440px;padding:26px;border-radius:24px;background:rgba(14,17,24,.92);border:1px solid rgba(255,90,90,.25);backdrop-filter:blur(28px);box-shadow:0 40px 100px rgba(0,0,0,.7);animation:mUp .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes mUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{font-size:19px;color:#fff;display:flex;align-items:center;gap:9px}
.modal .sub{font-size:12px;color:var(--muted);margin:8px 0 18px}
.drop{border:2px dashed rgba(255,90,90,.35);border-radius:16px;padding:34px 20px;text-align:center;cursor:pointer;transition:.25s}
.drop:hover{border-color:#ff9090;background:rgba(255,90,90,.04)}
.drop .ic{font-size:32px}
.drop .t{font:600 13px 'Space Grotesk';color:#fff;margin-top:10px}
.drop .s{font-size:11px;color:var(--muted);margin-top:4px}
.file-ok{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.3);font-size:12px;color:var(--green)}
.m-reason{width:100%;margin-top:14px;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#fff;font:500 13px 'Inter';outline:none;resize:vertical}
.m-reason:focus{border-color:rgba(255,90,90,.5)}
.m-btns{display:flex;gap:10px;margin-top:20px}
.m-send{flex:1;padding:14px;border-radius:13px;border:none;cursor:pointer;font:700 14px 'Space Grotesk';color:#fff;background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 0 20px rgba(231,76,60,.35);transition:.25s}
.m-send:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 34px rgba(231,76,60,.55)}
.m-send:disabled{opacity:.35;cursor:not-allowed}
.m-close{padding:14px 20px;border-radius:13px;cursor:pointer;font:600 13px 'Inter';color:var(--muted);background:transparent;border:1px solid rgba(255,255,255,.14)}
.m-close:hover{color:#fff}

@media(max-width:700px){
  .p-balance{margin-left:0;text-align:left;width:100%}
  .nav-links{display:none}
}
</style>

<script>
const fmt=n=>n.toLocaleString('ru-RU')+' ₸';

/* ===== данные из localStorage + демо при первом визите ===== */
if(!localStorage.getItem('tenge_orders')){
  localStorage.setItem('tenge_orders',JSON.stringify([
   {id:'TG-1042',lotId:1,icon:'🔫',title:'PUBG Mobile — 660 UC',seller:'DarkSide_KZ',price:4400,status:'FUNDS_HOLD',stage:2,ts:Date.now()-3600000},
   {id:'TG-1038',lotId:3,icon:'💎',title:'Free Fire — 1080 алмазов',seller:'FF_Shymkent',price:3900,status:'COMPLETED',stage:3,ts:Date.now()-86400000},
  ]));
}
const ORDERS=JSON.parse(localStorage.getItem('tenge_orders')||'[]');
const MY_LOTS=JSON.parse(localStorage.getItem('tenge_listings')||'[]');

const STATUS_MAP={
 FUNDS_HOLD:{cls:'st-hold',lbl:'FUNDS_HOLD'},
 DATA_TRANSFERRED:{cls:'st-wait',lbl:'ПРОВЕРКА 24Ч'},
 COMPLETED:{cls:'st-done',lbl:'ЗАВЕРШЕНО'},
 DISPUTE:{cls:'st-dispute',lbl:'СПОР'},
};

function orderCard(o,actions){
  const st=STATUS_MAP[o.status]||STATUS_MAP.FUNDS_HOLD;
  return `
   <div class="order glass">
     <div class="o-head">
       <div class="o-ic">${o.icon}</div>
       <div>
         <div class="o-title">${o.title}</div>
         <div class="o-sub">Продавец: ${o.seller} · заказ #${o.id}</div>
       </div>
       <div class="o-price">
         <div class="p grad-text">${fmt(o.price)}</div>
         <span class="st-tag ${st.cls}">${st.lbl}</span>
       </div>
     </div>
     ${stepper(o.stage)}
     ${actions?`<div class="o-actions">
       <button class="btn-ok" onclick="confirmOrder('${o.id}')">✓ Подтвердить получение</button>
       <button class="btn-dispute" onclick="openDispute('${o.id}')">⚖️ Открыть спор</button>
     </div>`:''}
   </div>`;
}

function lotCard(l){
  const fee=Math.round(l.price*0.05);
  return `
   <div class="order glass">
     <div class="o-head">
       <div class="o-ic">${l.icon}</div>
       <div>
         <div class="o-title">${l.title}</div>
         <div class="o-sub">Опубликован · ${new Date(l.ts*1000).toLocaleDateString('ru-RU')}</div>
       </div>
       <div class="o-price">
         <div class="p grad-text">${fmt(l.price)}</div>
         <span class="st-tag st-done">АКТИВЕН</span>
       </div>
     </div>
     <div style="margin-top:12px;font-size:12px;color:var(--muted)">Комиссия при продаже: <b class="grad-text">${fmt(fee)}</b> · Получишь: <b style="color:#fff">${fmt(l.price-fee)}</b></div>
   </div>`;
}

const content=document.getElementById('content');
let currentOrderId=null;

function render(tab){
  let html='';
  if(tab==='buys'){
    const list=ORDERS;
    html=list.length?list.map(o=>orderCard(o,o.status==='FUNDS_HOLD'||o.status==='DATA_TRANSFERRED')).join('')
      :`<div class="empty glass"><div class="big">🌕</div>Покупок пока нет. <a href="./catalog.html" style="color:var(--cyan)">Открыть каталог →</a></div>`;
  }else if(tab==='sells'){
    html=MY_LOTS.length?MY_LOTS.map(lotCard).join('')
      :`<div class="empty glass"><div class="big">💰</div>Лотов пока нет. <a href="./sell.html" style="color:var(--cyan)">Создать первый лот →</a></div>`;
  }else{
    const list=ORDERS.filter(o=>o.status==='FUNDS_HOLD'||o.status==='DATA_TRANSFERRED'||o.status==='DISPUTE');
    html=list.length?list.map(o=>orderCard(o,o.status!=='DISPUTE')).join('')
      :`<div class="empty glass"><div class="big">🛡</div>Нет активных escrow-сделок</div>`;
  }
  content.innerHTML=html;
}

/* stepper builder: stage 0..3 */
function stepper(stage){
  const steps=['Оплачено Kaspi','Ожидание передачи','Проверка покупателем (24ч)','Завершено'];
  let h='';
  steps.forEach((s,i)=>{
    const cls=i<stage?'done':(i===stage?'now':'');
    const mark=i<stage?'✓':(i+1);
    h+=`<div class="stp ${cls}"><div class="dot">${mark}</div><div class="lb">${s}</div></div>`;
    if(i<steps.length-1)h+=`<div class="stp-line ${i<stage?'done':''}"></div>`;
  });
  return `<div class="stepper">${h}</div>`;
}

const DATA={};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  render(t.dataset.tab);
});

function confirmOrder(id){
  const orders=JSON.parse(localStorage.getItem('tenge_orders')||'[]');
  const o=orders.find(x=>x.id===id);
  if(o){o.status='COMPLETED';o.stage=3;localStorage.setItem('tenge_orders',JSON.stringify(orders));}
  /* облако */
  if(window.sb&&o&&o.cloudId){sb.from('orders').update({status:'COMPLETED'}).eq('id',o.cloudId).then(()=>{}).catch(e=>console.warn(e));}
  alert('Сделка завершена! Средства отправлены продавцу (PAYOUT_TO_SELLER).');
  location.reload();
}

/* dispute modal */
const bg=document.getElementById('disputeBg');
const fileInput=document.getElementById('fileInput');
const fileOk=document.getElementById('fileOk');
const dReason=document.getElementById('dReason');
const dSend=document.getElementById('dSend');
let hasFile=false;

function openDispute(id){
  const o=ORDERS.find(x=>x.id===id);
  currentOrderId=id;
  document.getElementById('dOrderInfo').textContent=o.title+' · заказ #'+o.id;
  bg.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDispute(){
  bg.classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('dClose').onclick=closeDispute;
bg.addEventListener('click',e=>{if(e.target===bg)closeDispute()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDispute()});

document.getElementById('dropZone').onclick=()=>fileInput.click();
fileInput.addEventListener('change',()=>{
  if(fileInput.files.length){
    hasFile=true;
    fileOk.style.display='block';
    fileOk.textContent='✓ Загружено: '+fileInput.files[0].name;
    updSend();
  }
});
dReason.addEventListener('input',updSend);
function updSend(){dSend.disabled=!(hasFile&&dReason.value.trim().length>=10)}
dSend.onclick=()=>{
  dSend.textContent='✓ Спор открыт';
  dSend.disabled=true;
  /* помечаем заказ как DISPUTE */
  const orders=JSON.parse(localStorage.getItem('tenge_orders')||'[]');
  const o=orders.find(x=>x.id===currentOrderId);
  if(o){o.status='DISPUTE';localStorage.setItem('tenge_orders',JSON.stringify(orders));}
  /* облако */
  if(window.sb&&o&&o.cloudId){sb.from('orders').update({status:'DISPUTE'}).eq('id',o.cloudId).then(()=>{}).catch(e=>console.warn(e));}
  setTimeout(()=>{
    closeDispute();
    alert('Спор #DSP-'+Math.floor(Math.random()*900+100)+' передан арбитру. Видео будет проверено в течение 2 часов. Средства остаются заморожены.');
    dSend.textContent='Отправить арбитру ⚖️';
    dReason.value='';fileInput.value='';hasFile=false;fileOk.style.display='none';updSend();
    location.reload();
  },600);
};

render('buys');

/* ============ LIVE TRADE CHAT ============ */
(function(){
  const css=`
  .chat-bg{position:fixed;inset:0;z-index:300;background:rgba(3,4,6,.72);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:0}
  .chat-bg.open{display:flex}
  .chat-win{width:100%;max-width:520px;height:88vh;background:rgba(14,17,24,.97);border:1px solid rgba(255,255,255,.14);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:chUp .38s cubic-bezier(.2,.9,.3,1.1);overflow:hidden}
  @keyframes chUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .ch-head{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;flex-shrink:0}
  .ch-ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4FACFE,#8B5CF6);display:flex;align-items:center;justify-content:center;font:700 15px 'Space Grotesk';color:#fff;flex-shrink:0;position:relative}
  .ch-ava::after{content:'';position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#34d399;border:2px solid #0e1118}
  .ch-name{font:600 14px 'Space Grotesk';color:#fff}
  .ch-sub{font-size:11px;color:#8A93A6}
  .ch-x{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#8A93A6;cursor:pointer;font-size:15px}
  .ch-x:hover{color:#fff;border-color:rgba(0,242,254,.5)}
  .ch-warn{margin:12px 16px 0;padding:11px 14px;border-radius:12px;background:rgba(255,90,90,.07);border:1px solid rgba(255,90,90,.24);font-size:11px;line-height:1.5;color:#ffb4b4;flex-shrink:0}
  .ch-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .ch-body::-webkit-scrollbar{width:6px}.ch-body::-webkit-scrollbar-thumb{background:#1a2230;border-radius:6px}
  .bub{max-width:78%;padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.5;word-break:break-word}
  .bub .t{display:block;font-size:9.5px;opacity:.55;margin-top:5px;letter-spacing:.04em}
  .bub.me{align-self:flex-end;background:linear-gradient(135deg,#00F2FE,#4FACFE);color:#060709;border-bottom-right-radius:5px}
  .bub.them{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#E7EAF0;border-bottom-left-radius:5px}
  .bub.sys{align-self:center;max-width:92%;text-align:center;background:rgba(0,242,254,.07);border:1px solid rgba(0,242,254,.24);color:#9be9f0;font-size:11.5px;padding:9px 14px;border-radius:100px}
  .ch-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:9px;flex-shrink:0}
  .ch-in{flex:1;padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font:500 13.5px 'Inter';outline:none}
  .ch-in:focus{border-color:rgba(0,242,254,.6)}
  .ch-send{padding:0 20px;border-radius:14px;border:none;cursor:pointer;font:700 13px 'Space Grotesk';color:#060709;background:linear-gradient(135deg,#00F2FE,#4FACFE);box-shadow:0 0 16px rgba(0,242,254,.35)}
  .btn-chat{padding:10px 20px;border-radius:11px;cursor:pointer;font:700 12px 'Space Grotesk';color:#00F2FE;background:rgba(0,242,254,.07);border:1px solid rgba(0,242,254,.3);transition:.25s}
  .btn-chat:hover{background:rgba(0,242,254,.15)}
  `;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  document.body.insertAdjacentHTML('beforeend',`
  <div class="chat-bg" id="chatBg"><div class="chat-win">
    <div class="ch-head">
      <div class="ch-ava" id="chAva">D</div>
      <div><div class="ch-name" id="chName">Продавец</div><div class="ch-sub" id="chSub">Чат сделки</div></div>
      <button class="ch-x" id="chX">✕</button>
    </div>
    <div class="ch-warn">🛡 Не уходите в другие мессенджеры. Все данные передавайте только здесь — переписка сохраняется и служит доказательством в арбитраже.</div>
    <div class="ch-body" id="chBody"></div>
    <div class="ch-foot">
      <input class="ch-in" id="chIn" placeholder="Сообщение...">
      <button class="ch-send" id="chSend">→</button>
    </div>
  </div></div>`);

  let curId=null;
  const key=id=>'tenge_chat_'+id;
  const now=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

  function seed(o){
    return [
      {r:'sys',t:'Заказ #'+o.id+' создан. Средства заморожены (escrow).'},
      {r:'them',t:'Здравствуйте! Вижу оплату по заказу '+o.id+'. Напишите ваш игровой ID — отправлю в течение 5 минут.',ts:now()},
      {r:'sys',t:'⏳ У продавца 24 часа на передачу данных'}
    ];
  }
  function load(o){
    let m=JSON.parse(localStorage.getItem(key(o.id))||'null');
    if(!m){m=seed(o);localStorage.setItem(key(o.id),JSON.stringify(m))}
    return m;
  }
  function draw(m){
    document.getElementById('chBody').innerHTML=m.map(x=>
      x.r==='sys'?`<div class="bub sys">${x.t}</div>`
      :`<div class="bub ${x.r==='me'?'me':'them'}">${x.t}<span class="t">${x.ts||''}</span></div>`).join('');
    const b=document.getElementById('chBody');b.scrollTop=b.scrollHeight;
  }
  window.openChat=function(id){
    const o=(typeof ORDERS!=='undefined'?ORDERS:[]).find(x=>x.id===id)||{id:id,seller:'Продавец',title:''};
    curId=o.id;
    document.getElementById('chName').textContent=o.seller||'Продавец';
    document.getElementById('chAva').textContent=(o.seller||'P')[0];
    document.getElementById('chSub').textContent='Заказ #'+o.id+(o.title?' · '+o.title:'');
    draw(load(o));
    document.getElementById('chatBg').classList.add('open');
    document.body.style.overflow='hidden';
  };
  function close(){document.getElementById('chatBg').classList.remove('open');document.body.style.overflow=''}
  document.getElementById('chX').onclick=close;
  document.getElementById('chatBg').addEventListener('click',e=>{if(e.target.id==='chatBg')close()});

  function send(){
    const i=document.getElementById('chIn');const v=i.value.trim();if(!v||!curId)return;
    const m=JSON.parse(localStorage.getItem(key(curId))||'[]');
    m.push({r:'me',t:v,ts:now()});
    localStorage.setItem(key(curId),JSON.stringify(m));
    i.value='';draw(m);
    setTimeout(()=>{
      const m2=JSON.parse(localStorage.getItem(key(curId))||'[]');
      const reply=/\d{5,}/.test(v)
        ? 'Принял ID! Отправляю прямо сейчас, запишите видео получения 🎥'
        : 'Хорошо, понял вас. Оставайтесь на связи.';
      m2.push({r:'them',t:reply,ts:now()});
      if(/\d{5,}/.test(v))m2.push({r:'sys',t:'✅ Продавец подтвердил передачу. Проверьте товар и нажмите «Подтвердить получение».'});
      localStorage.setItem(key(curId),JSON.stringify(m2));draw(m2);
    },1400);
  }
  document.getElementById('chSend').onclick=send;
  document.getElementById('chIn').addEventListener('keydown',e=>{if(e.key==='Enter')send()});

  /* кнопка «Чат сделки» на всех активных заказах */
  function addBtns(){
    document.querySelectorAll('#content .order').forEach(card=>{
      if(card.querySelector('.btn-chat'))return;
      const tag=card.querySelector('.st-tag');
      if(!tag||/ЗАВЕРШЕНО|АКТИВЕН/.test(tag.textContent))return;
      const idm=card.querySelector('.o-sub')?.textContent.match(/#(TG-\d+)/);
      if(!idm)return;
      let act=card.querySelector('.o-actions');
      if(!act){act=document.createElement('div');act.className='o-actions';card.appendChild(act)}
      const b=document.createElement('button');
      b.className='btn-chat';b.textContent='💬 Чат сделки';
      b.onclick=()=>openChat(idm[1]);
      act.prepend(b);
    });
  }
  const mo=new MutationObserver(addBtns);
  mo.observe(document.getElementById('content'),{childList:true,subtree:true});
  addBtns();
})();
</script>
</body>
</html>
